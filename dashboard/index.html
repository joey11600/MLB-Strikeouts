<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strikeouts Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08080A;
    --surface: #111113;
    --surface-2: #19191D;
    --surface-3: #222228;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --text: #EDEDEF;
    --text-secondary: #8B8B96;
    --text-muted: #55555E;
    --over: #10B981;
    --over-dim: rgba(16,185,129,0.12);
    --over-glow: rgba(16,185,129,0.25);
    --under: #F43F5E;
    --under-dim: rgba(244,63,94,0.12);
    --under-glow: rgba(244,63,94,0.25);
    --accent: #F59E0B;
    --accent-dim: rgba(245,158,11,0.12);
    --accent-glow: rgba(245,158,11,0.25);
    --strong: #10B981;
    --medium: #F59E0B;
    --lean: #6366F1;
    --font-display: 'Outfit', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-display);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16,185,129,0.06), transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(244,63,94,0.04), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .noise {
    position: fixed;
    inset: 0;
    opacity: 0.025;
    pointer-events: none;
    z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  /* ===== HEADER ===== */
  .header {
    padding: 24px 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--over), #059669);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 16px;
    color: #fff;
    letter-spacing: -0.04em;
    box-shadow: 0 0 20px var(--over-glow);
  }

  .header-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--text), var(--text-secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-date {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--over);
    box-shadow: 0 0 8px var(--over-glow);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* ===== HERO STATS ===== */
  .hero-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 24px;
    animation: fadeUp 0.6s ease-out both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .hero-stat:hover {
    border-color: var(--border-hover);
  }

  .hero-stat-value {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 500;
    line-height: 1;
    margin-bottom: 4px;
  }

  .hero-stat-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
  }

  .stat-positive { color: var(--over); }
  .stat-negative { color: var(--under); }
  .stat-neutral  { color: var(--text-secondary); }

  /* ===== SECTION HEADERS ===== */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .section-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
  }

  .section-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 3px 10px;
  }

  /* ===== PICK CARDS ===== */
  .picks-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }

  .pick-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    position: relative;
    overflow: hidden;
    transition: all 0.25s ease;
    animation: fadeUp 0.6s ease-out both;
  }

  .pick-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-1px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }

  .pick-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 100%;
    border-radius: 3px 0 0 3px;
  }

  .pick-card.side-OVER::before {
    background: linear-gradient(180deg, var(--over), rgba(16,185,129,0.3));
    box-shadow: 0 0 12px var(--over-glow);
  }

  .pick-card.side-UNDER::before {
    background: linear-gradient(180deg, var(--under), rgba(244,63,94,0.3));
    box-shadow: 0 0 12px var(--under-glow);
  }

  .pick-card.is-ladder::after {
    content: 'LADDER';
    position: absolute;
    top: 14px;
    right: 100px;
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.15em;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid rgba(245,158,11,0.2);
    border-radius: 100px;
    padding: 2px 8px;
    z-index: 2;
  }

  /* ===== LADDER DROPDOWN ===== */
  .ladder-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    margin-left: 10px;
    padding: 6px 10px;
    background: var(--accent-dim);
    border: 1px solid rgba(245,158,11,0.15);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  .ladder-toggle:hover {
    border-color: rgba(245,158,11,0.3);
    background: rgba(245,158,11,0.15);
  }

  .ladder-toggle-icon {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
    transition: transform 0.25s ease;
    display: inline-block;
  }

  .ladder-toggle.open .ladder-toggle-icon {
    transform: rotate(90deg);
  }

  .ladder-toggle-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .ladder-toggle-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    margin-left: auto;
  }

  .ladder-rungs {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.16,1,0.3,1);
  }

  .ladder-rungs.open {
    max-height: 600px;
  }

  .ladder-rung {
    margin: 8px 10px 0;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    border-radius: 8px;
    display: grid;
    grid-template-columns: 1.2fr 0.8fr 0.8fr 1fr;
    gap: 6px;
    align-items: center;
    animation: fadeUp 0.3s ease-out both;
  }

  .ladder-rung:last-child {
    margin-bottom: 4px;
  }

  .ladder-rung .pick-datum-value {
    font-size: 13px;
  }

  .ladder-rung .pick-datum-label {
    font-size: 8px;
  }

  .ladder-rung-result {
    grid-column: 1 / -1;
    margin-top: 2px;
  }

  .ladder-rung-result .pick-result {
    margin-left: 0;
    font-size: 10px;
    padding: 2px 8px;
  }

  .pick-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-left: 10px;
  }

  .pick-pitcher {
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.02em;
    flex: 1;
  }

  .pick-strength-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid;
  }

  .strength-STRONG {
    color: var(--strong);
    border-color: rgba(16,185,129,0.25);
    background: var(--over-dim);
  }

  .strength-MEDIUM {
    color: var(--medium);
    border-color: rgba(245,158,11,0.25);
    background: var(--accent-dim);
  }

  .strength-LEAN {
    color: var(--lean);
    border-color: rgba(99,102,241,0.25);
    background: rgba(99,102,241,0.1);
  }

  .pick-matchup {
    font-size: 12px;
    color: var(--text-muted);
    padding-left: 10px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pick-matchup .venue-dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }

  .pick-data-row {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr;
    gap: 8px;
    padding-left: 10px;
    margin-bottom: 12px;
  }

  .pick-datum {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .pick-datum-value {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 500;
  }

  .pick-datum-label {
    font-size: 9px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  .val-over { color: var(--over); }
  .val-under { color: var(--under); }

  /* Edge bar */
  .edge-bar-container {
    padding-left: 10px;
    margin-bottom: 6px;
  }

  .edge-bar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .edge-bar-label {
    font-size: 9px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  .edge-bar-value {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
  }

  .edge-bar-track {
    width: 100%;
    height: 4px;
    background: var(--surface-2);
    border-radius: 100px;
    overflow: hidden;
  }

  .edge-bar-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 1s cubic-bezier(0.16,1,0.3,1);
    width: 0;
  }

  .edge-bar-fill.fill-over {
    background: linear-gradient(90deg, var(--over), #34D399);
    box-shadow: 0 0 8px var(--over-glow);
  }

  .edge-bar-fill.fill-under {
    background: linear-gradient(90deg, var(--under), #FB7185);
    box-shadow: 0 0 8px var(--under-glow);
  }

  /* Result badges */
  .pick-result {
    margin-left: 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .result-WIN {
    color: var(--over);
    background: var(--over-dim);
    border: 1px solid rgba(16,185,129,0.2);
  }

  .result-LOSS {
    color: var(--under);
    background: var(--under-dim);
    border: 1px solid rgba(244,63,94,0.2);
  }

  .result-PUSH {
    color: var(--text-secondary);
    background: var(--surface-2);
    border: 1px solid var(--border);
  }

  .result-VOID {
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
  }

  .result-PENDING {
    color: var(--text-muted);
    background: transparent;
    border: 1px dashed rgba(255,255,255,0.1);
  }

  .lineup-badge {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-left: auto;
    padding-right: 10px;
  }

  .lineup-confirmed { color: var(--over); }
  .lineup-projected { color: var(--accent); }

  .pick-footer {
    display: flex;
    align-items: center;
    padding-left: 10px;
    margin-top: 6px;
  }

  /* ===== CHART ===== */
  .chart-section {
    margin-bottom: 28px;
    animation: fadeUp 0.6s ease-out 0.4s both;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    overflow: hidden;
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }

  .chart-value {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 500;
  }

  .chart-subtitle {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  .pnl-chart {
    width: 100%;
    height: 100px;
    display: block;
  }

  .chart-basis {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-muted);
    text-align: right;
    margin-top: 8px;
    letter-spacing: 0.05em;
  }

  /* ===== HISTORY ===== */
  .history-section {
    margin-bottom: 32px;
    animation: fadeUp 0.6s ease-out 0.5s both;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .history-item:last-child { border-bottom: none; }

  .history-date {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    width: 72px;
    flex-shrink: 0;
  }

  .history-name {
    flex: 1;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .history-result {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .history-pnl {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    width: 60px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ===== FOOTER ===== */
  footer {
    padding: 16px 0 24px;
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    gap: 16px;
  }

  footer span {
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
  }

  /* ===== EMPTY STATE ===== */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
  }

  .empty-state-icon {
    font-size: 32px;
    margin-bottom: 8px;
    opacity: 0.5;
  }

  .empty-state p {
    font-size: 13px;
    line-height: 1.6;
  }

  .empty-state code {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--surface-2);
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* ===== ANIMATION DELAYS ===== */
  .pick-card:nth-child(1) { animation-delay: 0.1s; }
  .pick-card:nth-child(2) { animation-delay: 0.2s; }
  .pick-card:nth-child(3) { animation-delay: 0.3s; }
  .pick-card:nth-child(4) { animation-delay: 0.35s; }
  .pick-card:nth-child(5) { animation-delay: 0.4s; }
  .pick-card:nth-child(6) { animation-delay: 0.45s; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 500px) {
    .container { padding: 0 12px; }
    .hero-stats { grid-template-columns: repeat(2, 1fr); }
    .hero-stat-value { font-size: 18px; }
    .picks-grid { grid-template-columns: 1fr; }
    .pick-data-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .pick-pitcher { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="noise"></div>
<div class="container">

  <div class="header">
    <div class="header-left">
      <div class="logo-mark">K</div>
      <span class="header-title">Strikeouts Terminal</span>
    </div>
    <div class="header-date">
      <span class="live-dot"></span>
      <span id="header-date"></span>
    </div>
  </div>

  <div class="hero-stats" id="hero-stats"></div>

  <div id="today-section"></div>

  <div id="chart-section"></div>

  <div id="history-section"></div>

  <footer>
    <span>flat 100u basis</span>
    <span id="footer-time"></span>
  </footer>
</div>

<script>
(function() {
  function pnlClass(v) {
    if (v > 0.005) return 'stat-positive';
    if (v < -0.005) return 'stat-negative';
    return 'stat-neutral';
  }

  function pnlStr(v) {
    return (v >= 0 ? '+' : '') + v.toFixed(2) + 'u';
  }

  function pctStr(v) {
    return (v * 100).toFixed(1) + '%';
  }

  function oddsStr(o) {
    if (!o) return '—';
    var n = parseInt(o, 10);
    if (isNaN(n)) return '—';
    return n > 0 ? '+' + n : '' + n;
  }

  function renderHero(rec, pnl) {
    var el = document.getElementById('hero-stats');
    var total = rec.wins + rec.losses;
    var rateStr = total > 0 ? pctStr(rec.hit_rate) : '—';
    var pnlVal = pnl.total.value;
    var roiStr = pnl.roi !== 0 ? pctStr(pnl.roi) : '—';

    el.innerHTML =
      '<div class="hero-stat">' +
        '<div class="hero-stat-value">' + rec.wins + '–' + rec.losses + '</div>' +
        '<div class="hero-stat-label">Record</div>' +
      '</div>' +
      '<div class="hero-stat">' +
        '<div class="hero-stat-value">' + rateStr + '</div>' +
        '<div class="hero-stat-label">Hit Rate</div>' +
      '</div>' +
      '<div class="hero-stat">' +
        '<div class="hero-stat-value ' + pnlClass(pnlVal) + '">' + pnlStr(pnlVal) + '</div>' +
        '<div class="hero-stat-label">P&amp;L</div>' +
      '</div>' +
      '<div class="hero-stat">' +
        '<div class="hero-stat-value">' + roiStr + '</div>' +
        '<div class="hero-stat-label">ROI</div>' +
      '</div>';
  }

  function renderPickCard(pick, i) {
    var sideClass = 'side-' + pick.pick_side;
    var ladderClass = pick.is_ladder ? ' is-ladder' : '';
    var strengthClass = 'strength-' + pick.pick_strength;
    var valClass = pick.pick_side === 'OVER' ? 'val-over' : 'val-under';
    var fillClass = pick.pick_side === 'OVER' ? 'fill-over' : 'fill-under';

    var odds = pick.pick_side === 'OVER' ? pick.market_over_odds : pick.market_under_odds;
    if (pick.is_ladder) odds = pick.market_over_odds;

    var matchup = pick.pitcher_team + (pick.is_home ? ' vs ' : ' @ ') + pick.opponent_team;

    var edgePct = Math.min((pick.edge_pct || 0) / 0.30 * 100, 100);

    var resultHtml = '';
    if (pick.graded_result) {
      var resultClass = 'result-' + pick.graded_result;
      var rText = pick.graded_result;
      if (pick.actual_strikeouts !== null && pick.actual_strikeouts !== undefined) {
        rText += ' · ' + pick.actual_strikeouts + 'K';
      }
      if ((pick.graded_result === 'WIN' || pick.graded_result === 'LOSS') && pick.profit_loss_units) {
        rText += ' · ' + pnlStr(pick.profit_loss_units.value);
      }
      resultHtml = '<span class="pick-result ' + resultClass + '">' + rText + '</span>';
    } else {
      resultHtml = '<span class="pick-result result-PENDING">PENDING</span>';
    }

    var lineupClass = pick.lineup_source === 'confirmed' ? 'lineup-confirmed' : 'lineup-projected';
    var lineupText = pick.lineup_source === 'confirmed' ? 'Confirmed' : 'Projected';

    return '<div class="pick-card ' + sideClass + ladderClass + '">' +
      '<div class="pick-top">' +
        '<span class="pick-pitcher">' + pick.pitcher_name + '</span>' +
        '<span class="pick-strength-badge ' + strengthClass + '">' + pick.pick_strength + '</span>' +
      '</div>' +
      '<div class="pick-matchup">' +
        '<span>' + matchup + '</span>' +
        '<span class="venue-dot"></span>' +
        '<span>' + pick.venue + '</span>' +
      '</div>' +
      '<div class="pick-data-row">' +
        '<div class="pick-datum">' +
          '<div class="pick-datum-value ' + valClass + '">' + pick.pick_side + ' ' + pick.line + '</div>' +
          '<div class="pick-datum-label">Pick</div>' +
        '</div>' +
        '<div class="pick-datum">' +
          '<div class="pick-datum-value">' + oddsStr(odds) + '</div>' +
          '<div class="pick-datum-label">Odds</div>' +
        '</div>' +
        '<div class="pick-datum">' +
          '<div class="pick-datum-value">' + pick.units_risked.toFixed(1) + 'u</div>' +
          '<div class="pick-datum-label">Stake</div>' +
        '</div>' +
        '<div class="pick-datum">' +
          '<div class="pick-datum-value">' + pctStr(pick.model_prob_over) + '</div>' +
          '<div class="pick-datum-label">Model P(O)</div>' +
        '</div>' +
      '</div>' +
      '<div class="edge-bar-container">' +
        '<div class="edge-bar-header">' +
          '<span class="edge-bar-label">Edge</span>' +
          '<span class="edge-bar-value">' + pctStr(pick.edge_pct) + '</span>' +
        '</div>' +
        '<div class="edge-bar-track">' +
          '<div class="edge-bar-fill ' + fillClass + '" data-width="' + edgePct + '"></div>' +
        '</div>' +
      '</div>' +
      '<div class="pick-footer">' +
        resultHtml +
        '<span class="lineup-badge ' + lineupClass + '">' + lineupText + '</span>' +
      '</div>' +
    '</div>';
  }

  function groupByPitcher(picks) {
    var groups = [];
    var map = {};
    for (var i = 0; i < picks.length; i++) {
      var p = picks[i];
      var key = p.pitcher_name + '|' + p.date + '|' + p.pitcher_team;
      if (!map[key]) {
        map[key] = { primary: null, ladders: [] };
        groups.push(map[key]);
      }
      if (p.is_ladder) {
        map[key].ladders.push(p);
      } else {
        map[key].primary = p;
      }
    }
    return groups;
  }

  function renderLadderRung(pick) {
    var valClass = pick.pick_side === 'OVER' ? 'val-over' : 'val-under';
    var odds = pick.market_over_odds || '';

    var resultHtml = '';
    if (pick.graded_result) {
      var resultClass = 'result-' + pick.graded_result;
      var rText = pick.graded_result;
      if (pick.actual_strikeouts !== null && pick.actual_strikeouts !== undefined) {
        rText += ' · ' + pick.actual_strikeouts + 'K';
      }
      if ((pick.graded_result === 'WIN' || pick.graded_result === 'LOSS') && pick.profit_loss_units) {
        rText += ' · ' + pnlStr(pick.profit_loss_units.value);
      }
      resultHtml = '<div class="ladder-rung-result"><span class="pick-result ' + resultClass + '">' + rText + '</span></div>';
    } else {
      resultHtml = '<div class="ladder-rung-result"><span class="pick-result result-PENDING">PENDING</span></div>';
    }

    return '<div class="ladder-rung">' +
      '<div class="pick-datum">' +
        '<div class="pick-datum-value ' + valClass + '">' + pick.pick_side + ' ' + pick.line + '</div>' +
        '<div class="pick-datum-label">Line</div>' +
      '</div>' +
      '<div class="pick-datum">' +
        '<div class="pick-datum-value">' + oddsStr(odds) + '</div>' +
        '<div class="pick-datum-label">Odds</div>' +
      '</div>' +
      '<div class="pick-datum">' +
        '<div class="pick-datum-value">' + pick.units_risked.toFixed(1) + 'u</div>' +
        '<div class="pick-datum-label">Stake</div>' +
      '</div>' +
      '<div class="pick-datum">' +
        '<div class="pick-datum-value">' + pctStr(pick.edge_pct) + '</div>' +
        '<div class="pick-datum-label">Edge</div>' +
      '</div>' +
      resultHtml +
    '</div>';
  }

  function renderPickCardWithLadder(group, i) {
    var primary = group.primary;
    var ladders = group.ladders;
    if (!primary && ladders.length > 0) {
      primary = ladders.shift();
    }
    if (!primary) return '';

    var card = renderPickCard(primary, i);

    if (ladders.length > 0) {
      var ladderHtml = '<div class="ladder-toggle" onclick="this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'open\')">' +
        '<span class="ladder-toggle-icon">&#9654;</span>' +
        '<span class="ladder-toggle-label">Ladder</span>' +
        '<span class="ladder-toggle-count">' + ladders.length + ' rung' + (ladders.length !== 1 ? 's' : '') + '</span>' +
      '</div>' +
      '<div class="ladder-rungs">';

      for (var j = 0; j < ladders.length; j++) {
        ladderHtml += renderLadderRung(ladders[j]);
      }
      ladderHtml += '</div>';

      card = card.replace(/<\/div>$/, ladderHtml + '</div>');
    }

    return card;
  }

  function renderToday(today) {
    var el = document.getElementById('today-section');
    if (!today.picks || today.picks.length === 0) {
      el.innerHTML =
        '<div class="section-header">' +
          '<span class="section-title">Today\'s Slate</span>' +
        '</div>' +
        '<div class="empty-state">' +
          '<div class="empty-state-icon">K</div>' +
          '<p>No picks yet today.<br>Run <code>python run.py predict</code></p>' +
        '</div>';
      return;
    }

    var countLabel = today.pick_count + ' pick' + (today.pick_count !== 1 ? 's' : '');
    if (today.ladder_count > 0) {
      countLabel = today.primary_count + ' primary + ' + today.ladder_count + ' ladder';
    }

    var groups = groupByPitcher(today.picks);

    var html =
      '<div class="section-header">' +
        '<span class="section-title">Today\'s Slate</span>' +
        '<span class="section-badge">' + countLabel + ' · ' + today.total_units.toFixed(1) + 'u</span>' +
      '</div>' +
      '<div class="picks-grid">';

    for (var i = 0; i < groups.length; i++) {
      html += renderPickCardWithLadder(groups[i], i);
    }

    html += '</div>';
    el.innerHTML = html;

    setTimeout(function() {
      var bars = el.querySelectorAll('.edge-bar-fill');
      for (var j = 0; j < bars.length; j++) {
        bars[j].style.width = bars[j].getAttribute('data-width') + '%';
      }
    }, 100);
  }

  function renderChart(series, pnl) {
    var el = document.getElementById('chart-section');
    if (!series || series.length === 0) {
      el.innerHTML = '';
      return;
    }

    var vals = series.map(function(s) { return s.cumulative_pnl.value; });
    var maxV = Math.max.apply(null, vals.concat([1]));
    var minV = Math.min.apply(null, vals.concat([-1]));
    var range = maxV - minV || 1;

    var w = 480; var h = 100; var pad = 2;
    var points = [];
    for (var i = 0; i < series.length; i++) {
      var x = pad + (i / Math.max(series.length - 1, 1)) * (w - 2 * pad);
      var y = pad + ((maxV - vals[i]) / range) * (h - 2 * pad);
      points.push(x.toFixed(1) + ',' + y.toFixed(1));
    }

    var zeroY = (pad + ((maxV - 0) / range) * (h - 2 * pad)).toFixed(1);
    var lastVal = vals[vals.length - 1];
    var lineColor = lastVal >= 0 ? 'var(--over)' : 'var(--under)';
    var gradId = 'grad-' + Math.random().toString(36).substr(2,5);

    var areaPoints = pad.toFixed(1) + ',' + h + ' ' + points.join(' ') + ' ' + (w - pad).toFixed(1) + ',' + h;

    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" class="pnl-chart" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">' +
      '<defs>' +
        '<linearGradient id="' + gradId + '" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="' + lineColor + '" stop-opacity="0.3"/>' +
          '<stop offset="100%" stop-color="' + lineColor + '" stop-opacity="0"/>' +
        '</linearGradient>' +
      '</defs>' +
      '<line x1="' + pad + '" y1="' + zeroY + '" x2="' + (w - pad) + '" y2="' + zeroY + '" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,4"/>' +
      '<polygon points="' + areaPoints + '" fill="url(#' + gradId + ')"/>' +
      '<polyline points="' + points.join(' ') + '" fill="none" stroke="' + lineColor + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + points[points.length - 1].split(',')[0] + '" cy="' + points[points.length - 1].split(',')[1] + '" r="3" fill="' + lineColor + '"/>' +
      '</svg>';

    var pnlVal = pnl.total.value;
    el.innerHTML =
      '<div class="chart-section">' +
        '<div class="section-header">' +
          '<span class="section-title">P&amp;L Curve</span>' +
        '</div>' +
        '<div class="chart-card">' +
          '<div class="chart-header">' +
            '<div>' +
              '<div class="chart-value ' + pnlClass(pnlVal) + '">' + pnlStr(pnlVal) + '</div>' +
              '<div class="chart-subtitle">Cumulative P&amp;L</div>' +
            '</div>' +
          '</div>' +
          svg +
          '<div class="chart-basis">flat 100u basis</div>' +
        '</div>' +
      '</div>';
  }

  function renderHistory(allPicks) {
    var el = document.getElementById('history-section');
    var graded = allPicks.filter(function(p) { return p.graded_result; });
    if (graded.length === 0) {
      el.innerHTML = '';
      return;
    }

    graded.sort(function(a, b) { return b.date.localeCompare(a.date); });

    var groups = groupByPitcher(graded);

    var primaryCount = 0;
    for (var g = 0; g < groups.length; g++) {
      if (groups[g].primary) primaryCount++;
      primaryCount += groups[g].ladders.filter(function(l) { return !groups[g].primary; }).length;
    }

    var html =
      '<div class="history-section">' +
        '<div class="section-header">' +
          '<span class="section-title">Recent Results</span>' +
          '<span class="section-badge">' + graded.length + ' graded</span>' +
        '</div>';

    var shown = 0;
    for (var i = 0; i < groups.length && shown < 15; i++) {
      var group = groups[i];
      var p = group.primary || group.ladders[0];
      if (!p) continue;

      var resultClass = 'result-' + p.graded_result;
      var pv = p.profit_loss_units ? p.profit_loss_units.value : 0;
      var nameLabel = p.pitcher_name;
      if (group.ladders.length > 0 && group.primary) {
        nameLabel += ' <span style="color:var(--accent);font-size:10px;font-family:var(--font-mono)">+' + group.ladders.length + ' ladder</span>';
      }

      var totalPnl = pv;
      for (var k = 0; k < group.ladders.length; k++) {
        totalPnl += group.ladders[k].profit_loss_units ? group.ladders[k].profit_loss_units.value : 0;
      }

      html += '<div class="history-item">' +
        '<span class="history-date">' + p.date + '</span>' +
        '<span class="history-name">' + nameLabel + '</span>' +
        '<span class="history-result ' + resultClass + '">' + p.pick_label + '</span>' +
        '<span class="history-pnl ' + pnlClass(totalPnl) + '">' + pnlStr(totalPnl) + '</span>' +
      '</div>';

      for (var j = 0; j < group.ladders.length; j++) {
        var lp = group.ladders[j];
        var lResultClass = 'result-' + lp.graded_result;
        var lpv = lp.profit_loss_units ? lp.profit_loss_units.value : 0;
        html += '<div class="history-item" style="padding-left:20px;opacity:0.7">' +
          '<span class="history-date" style="width:52px;color:var(--accent);font-size:10px">LADDER</span>' +
          '<span class="history-name" style="font-size:12px">' + lp.pick_label + '</span>' +
          '<span class="history-result ' + lResultClass + '">' + lp.graded_result + '</span>' +
          '<span class="history-pnl ' + pnlClass(lpv) + '">' + pnlStr(lpv) + '</span>' +
        '</div>';
      }
      shown++;
    }

    html += '</div>';
    el.innerHTML = html;
  }

  function render(data) {
    document.getElementById('header-date').textContent = data.today.date;
    renderHero(data.record, data.pnl);
    renderToday(data.today);
    renderChart(data.cumulative_series, data.pnl);
    renderHistory(data.all_picks);

    var ts = data.generated_at.replace('T', ' ').split('.')[0];
    document.getElementById('footer-time').textContent = ts;
  }

  fetch('data.json')
    .then(function(r) { return r.json(); })
    .then(render)
    .catch(function(err) {
      document.getElementById('today-section').innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-state-icon">K</div>' +
          '<p>Could not load data.<br>Run <code>python tools/dashboard_data.py</code></p>' +
        '</div>';
    });
})();
</script>
</body>
</html>
