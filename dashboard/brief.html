<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strikeouts — Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08080A;
    --surface: #111113;
    --border: rgba(255,255,255,0.06);
    --text: #EDEDEF;
    --text-muted: #55555E;
    --over: #10B981;
    --over-dim: rgba(16,185,129,0.12);
    --under: #F43F5E;
    --under-dim: rgba(244,63,94,0.12);
    --accent: #F59E0B;
    --accent-dim: rgba(245,158,11,0.12);
    --font-display: 'Outfit', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-display);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16,185,129,0.06), transparent);
    pointer-events: none;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
  }

  .logo-mark {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--over), #059669);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 20px;
    color: #fff;
    box-shadow: 0 0 24px rgba(16,185,129,0.3);
    margin-bottom: 8px;
  }

  header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.03em;
  }

  header .date {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .summary-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 16px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .summary-stat {
    text-align: center;
  }

  .summary-value {
    font-family: var(--font-mono);
    font-size: 32px;
    font-weight: 500;
    line-height: 1.1;
  }

  .summary-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .brief-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 16px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
  }

  .brief-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 100%;
  }

  .brief-card.side-OVER::before {
    background: linear-gradient(180deg, var(--over), rgba(16,185,129,0.3));
    box-shadow: 0 0 10px rgba(16,185,129,0.25);
  }

  .brief-card.side-UNDER::before {
    background: linear-gradient(180deg, var(--under), rgba(244,63,94,0.3));
    box-shadow: 0 0 10px rgba(244,63,94,0.25);
  }

  .brief-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 10px;
    margin-bottom: 4px;
  }

  .brief-pitcher {
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
  }

  .brief-ladder-tag {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.15em;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid rgba(245,158,11,0.2);
    border-radius: 100px;
    padding: 2px 8px;
    margin-left: 8px;
  }

  .brief-strength {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid;
  }

  .strength-STRONG { color: var(--over); border-color: rgba(16,185,129,0.25); background: var(--over-dim); }
  .strength-MEDIUM { color: var(--accent); border-color: rgba(245,158,11,0.25); background: var(--accent-dim); }
  .strength-LEAN   { color: #6366F1; border-color: rgba(99,102,241,0.25); background: rgba(99,102,241,0.1); }

  .brief-matchup {
    font-size: 12px;
    color: var(--text-muted);
    padding-left: 10px;
    margin-bottom: 10px;
  }

  .brief-pick-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding-left: 10px;
  }

  .brief-side {
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 500;
  }

  .val-over { color: var(--over); }
  .val-under { color: var(--under); }

  .brief-odds {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
  }

  .brief-units {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 500;
    color: var(--text-muted);
    margin-left: auto;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
    font-size: 15px;
  }

  footer {
    text-align: center;
    margin-top: 20px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-mark">K</div>
    <h1>Strikeouts</h1>
    <div class="date" id="header-date"></div>
  </header>

  <div class="summary-row" id="summary-bar"></div>

  <div id="cards"></div>

  <footer>flat 100u basis</footer>
</div>

<script>
(function() {
  function oddsStr(o) {
    if (!o) return '';
    var n = parseInt(o, 10);
    if (isNaN(n)) return '';
    return n > 0 ? '+' + n : '' + n;
  }

  function render(data) {
    document.getElementById('header-date').textContent = data.today.date;

    document.getElementById('summary-bar').innerHTML =
      '<div class="summary-stat"><div class="summary-value">' + data.today.pick_count + '</div><div class="summary-label">Picks</div></div>' +
      '<div class="summary-stat"><div class="summary-value">' + data.today.total_units.toFixed(1) + 'u</div><div class="summary-label">Risked</div></div>' +
      '<div class="summary-stat"><div class="summary-value">' + data.record.wins + '–' + data.record.losses + '</div><div class="summary-label">Record</div></div>';

    var el = document.getElementById('cards');
    if (!data.today.picks || data.today.picks.length === 0) {
      el.innerHTML = '<div class="empty-state">No picks today</div>';
      return;
    }

    var sorted = data.today.picks.slice().sort(function(a, b) {
      if (a.pitcher_name < b.pitcher_name) return -1;
      if (a.pitcher_name > b.pitcher_name) return 1;
      return a.is_ladder ? 1 : -1;
    });

    var html = '';
    for (var i = 0; i < sorted.length; i++) {
      var p = sorted[i];
      var sideClass = 'side-' + p.pick_side;
      var valClass = p.pick_side === 'OVER' ? 'val-over' : 'val-under';
      var odds = p.pick_side === 'OVER' ? p.market_over_odds : p.market_under_odds;
      if (p.is_ladder) odds = p.market_over_odds;
      var matchup = p.pitcher_team + (p.is_home ? ' vs ' : ' @ ') + p.opponent_team;

      html += '<div class="brief-card ' + sideClass + '">' +
        '<div class="brief-top">' +
          '<span class="brief-pitcher">' + p.pitcher_name +
            (p.is_ladder ? '<span class="brief-ladder-tag">LADDER</span>' : '') +
          '</span>' +
          '<span class="brief-strength strength-' + p.pick_strength + '">' + p.pick_strength + '</span>' +
        '</div>' +
        '<div class="brief-matchup">' + matchup + '</div>' +
        '<div class="brief-pick-row">' +
          '<span class="brief-side ' + valClass + '">' + p.pick_side + ' ' + p.line + '</span>' +
          '<span class="brief-odds">' + oddsStr(odds) + '</span>' +
          '<span class="brief-units">' + p.units_risked.toFixed(1) + 'u</span>' +
        '</div>' +
      '</div>';
    }

    el.innerHTML = html;
  }

  fetch('data.json')
    .then(function(r) { return r.json(); })
    .then(render)
    .catch(function() {
      document.getElementById('cards').innerHTML =
        '<div class="empty-state">Run: python tools/dashboard_data.py</div>';
    });
})();
</script>
</body>
</html>
