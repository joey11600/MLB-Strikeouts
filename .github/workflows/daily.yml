name: Daily strikeouts predict + grade

# WHY THIS EXISTS
#
# DraftKings returns 403 to datacenter IPs. Measured, not assumed: the
# gate is User-Agent plus egress IP reputation, never TLS fingerprint.
# That blocks Railway, and it blocks GitHub's shared runners too (their
# Azure ranges are on the same lists) -- the sibling NRFI repo burned
# weeks on a cron that failed every tick before working this out.
#
# So the odds fetch has to run somewhere with a residential-grade or
# otherwise unlisted IP. `runs-on` reads a repo variable so this file
# does not have to change when that happens:
#
#   RUNNER_LABEL unset  -> ubuntu-latest. Everything that does not need
#                          DraftKings still works (grading, model log,
#                          dashboard data). The odds fetch will 403 and
#                          the pipeline refuses rather than inventing
#                          prices, which is the designed behaviour.
#   RUNNER_LABEL set    -> a self-hosted runner on a small VPS, which is
#                          what actually makes the odds fetch work.
#
# Set it at:
#   https://github.com/joey11600/MLB-Strikeouts/settings/variables/actions

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Force one task (night|morning|close|lineups). Blank = whatever is due."
        required: false
        default: ""

  schedule:
    # Hourly, not one cron per task. GitHub cron is UTC-only, so
    # ET-anchored cron lines silently shift an hour at every DST
    # boundary. Instead every tick calls `railway_worker.py --due`,
    # which reuses the SAME ET schedule table, grace windows, and
    # once-per-day state as the resident Railway worker. DST is then
    # handled by construction and the two schedulers cannot drift apart.
    #
    # 06:00-23:00 UTC covers 02:00-19:00 ET in EDT and 01:00-18:00 ET in
    # EST, which brackets every entry in SCHEDULE under both offsets.
    #
    # Every 30 minutes, not hourly. GitHub failed to allocate a runner on
    # 2 of 6 dispatches on 2026-08-06 ("job was not acquired by Runner of
    # type hosted") -- their capacity, nothing we control. The retry is
    # the cadence itself: --due only marks a task done once it has run,
    # so a failed tick leaves the task due and the next tick picks it up.
    # At 30-minute spacing every window gets multiple attempts:
    #   lineups 16:45 ET, 120 min grace -> 4 chances
    #   close   18:15 ET,  45 min grace -> 2 chances
    #   morning 10:30 ET, 360 min grace -> many
    # Hourly gave the 45-minute close windows only ONE attempt, which
    # made a single allocation failure a lost CLV snapshot.
    - cron: "0,30 6-23 * * *"
    - cron: "0,30 0-2 * * *"

# One at a time. Two concurrent runs would both write the ledger, and
# the second push would fail on a non-fast-forward anyway.
concurrency:
  group: strikeouts-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The Statcast cache (~355 MB, 1.95M pitches) is gitignored, so a
      # fresh runner has none -- and without it EVERY pitcher fails
      # feature computation with "insufficient data (0 BF)". On
      # 2026-08-06 that published a 0-pitcher board over a good 20-pitcher
      # one. daily_pipeline now refuses rather than writing an empty
      # board, but the real fix is having the cache here at all.
      #
      # restore-keys lets today's run start from yesterday's cache and
      # top it up, instead of re-downloading three seasons every day.
      - name: Restore Statcast cache
        uses: actions/cache@v4
        with:
          path: data/statcast_cache
          key: statcast-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            statcast-${{ runner.os }}-

      # Pricing loads the CURRENT season only (daily_pipeline:
      # season_start = Mar 26 of the game year), so CI needs ~88 MB, not
      # the full 355 MB of 2024+2025 -- those are for training, and the
      # production models are already fitted and committed.
      #
      # backfill() skips any day already on disk, so calling it with the
      # whole season range is a fast no-op against a warm cache and a
      # one-time ~130-day fetch against a cold one.
      - name: Top up the Statcast cache for the current season
        env:
          STATCAST_CACHE_DIR: data/statcast_cache
        run: |
          python -c "
          from datetime import date
          from zoneinfo import ZoneInfo
          from datetime import datetime
          from data.backfill_statcast import backfill
          today = datetime.now(ZoneInfo('America/New_York')).date()
          backfill(date(today.year, 3, 26), today)
          "

      - name: Run whatever is due (ET-aware, DST-correct)
        env:
          # Keep scheduler state and the ledger inside the repo so the
          # once-per-day guard survives this runner being ephemeral.
          # Committed below.
          WORKER_STATE_DIR: data
          DATA_STATE_DIR: data
          STATCAST_CACHE_DIR: data/statcast_cache
          FORCE_TASK: ${{ github.event.inputs.task }}
        run: |
          if [ -n "$FORCE_TASK" ]; then
            python tools/railway_worker.py --task "$FORCE_TASK"
          else
            python tools/railway_worker.py --due
          fi

      - name: Show the ledger this run produced
        if: always()
        run: |
          python tools/pl_calc.py || true

      - name: Commit and push any ledger changes
        if: always()
        run: |
          git config user.name  "strikeouts-bot"
          git config user.email "noreply@github.com"

          # Stage the LEDGER first and decide on that alone. data.json
          # embeds a generated_at stamp, so staging it up front would
          # make every idle hourly tick look like a change and produce
          # ~18 empty commits a day. It rides along only when something
          # real moved.
          git add -A data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no ledger changes — not committing (data.json timestamp alone is not a change)"
            exit 0
          fi
          git add dashboard/public/data.json 2>/dev/null || true
          git commit -m "chore(ci): $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET') automated run"
          # Another runner (or the Railway worker) may have pushed while
          # this job ran. Rebase rather than force: the ledger is
          # append-mostly and losing the other side's rows is never OK.
          git pull --rebase --autostash origin master || true
          git push origin HEAD:master
